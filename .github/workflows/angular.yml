name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - github_testingbranch1  # Trigger deployment when changes are pushed to this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Ensure GitHub Actions has write access to the repo
      pages: write     # Ensure GitHub Actions can push to gh-pages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build Angular app
      run: npm run build --prod --base-href /angular/     # Use the default build command, ensure it's building correctly

    - name: Clean up previous worktree (if any)
      run: |
        git worktree remove --force github-pages-deploy-action-temp-deployment-folder || true
        git worktree prune || true

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages  # Deploy the app to the 'gh-pages' branch
        folder: dist/angular-build  # Ensure this matches your build output folder
