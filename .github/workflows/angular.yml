name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - github_testingbranch1 # Trigger deployment only when changes are pushed to the 'github_testingbranch1' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js (v20)
      uses: actions/setup-node@v3
      with:
        node-version: '20'   # Set Node.js to version 20 (or you can use '22')

    - name: Install dependencies
      run: npm install

    # Install Angular CLI
    - name: Install Angular CLI
      run: npm install -g @angular/cli

    # Build Angular app with the correct base href
    - name: Build Angular app
      run: ng build --configuration production --base-href=/angular/

    - name: Clean up previous worktree (if any)
      run: |
        git worktree remove --force github-pages-deploy-action-temp-deployment-folder || true
        git worktree prune || true

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages   # Deploy the app to the 'gh-pages' branch
        folder: dist/angular-build # Adjust this path to match your build output folder
