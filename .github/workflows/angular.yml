name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - github_testingbranch1  # Trigger deployment only when changes are pushed to the 'github_testingbranch1' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build Angular app
      run: npm run build --prod  # Use '--prod' to build the app in production mode

    - name: Clean up previous worktree (if any)
      run: |
        git worktree remove --force github-pages-deploy-action-temp-deployment-folder || true
        git worktree prune || true

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages   # Deploy the app to the 'gh-pages' branch
        folder: dist/angular-build  # Adjust this path to match your build output folder
