name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - github_testingbranch1  # Trigger deploymonly when changes are pushed to ththub_testingbranch1' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: github_testingbranch1  # Checkout the 'github_testingbranch1' branch

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build Angular app
      run: npm run build --prod

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages   # Deploy the app to the 'gh-pages' branch
        folder: dist/your-angular-app-name  # Path to your build output folder
